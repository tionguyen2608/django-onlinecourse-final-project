{% extends "onlinecourse/base.html" %}
{% block title %}Log in | OnlineCourse{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:480px">
    <h1 class="h3">Log in</h1>
    <p class="muted">Continue your course and assessment.</p>
    {% if message %}<p class="alert alert-danger">{{ message }}</p>{% endif %}
    <form action="{% url 'onlinecourse:login' %}" method="post">
        {% csrf_token %}
        <div class="form-group"><label for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
        <div class="form-group"><label for="password">Password</label><input class="form-control" type="password" id="password" name="psw" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
